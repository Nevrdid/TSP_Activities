name: Native build check

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - fix/launch-empty-library

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsdl2-dev \
            libsdl2-ttf-dev \
            libsdl2-image-dev \
            libsqlite3-dev

      - name: Build applications
        run: make -C build -j2
